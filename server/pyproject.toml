[project]
name = "ableton-live-mcp"
version = "0.1.0"
description = "MCP server (stdio) that controls Ableton Live 12 through the ClaudeLive Remote Script"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
ableton-live-mcp = "ableton_live_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_live_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
